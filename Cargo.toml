[package]
name = "rustgresql"
version = "0.1.0"
edition = "2021"
authors = ["Serdar ALBAYRAK <albayrak.serdar8@gmail.com>"]
description = "A PostgreSQL-like database implemented in Rust"
license = "MIT"

[features]
default = []
parallel = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
crc = "3.0"
log = "0.4"
env_logger = "0.11"
tempfile = "3.8"
thiserror = "1.0"
byteorder = "1.5"
lazy_static = "1.4"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
num_cpus = "1.16"
rustyline = "17.0.2"
comfy-table = "7.2.1"

[dev-dependencies]
quickcheck = "1.0"
criterion = "0.5"

# Benchmarks - temporarily disabled until full implementation
[[bench]]
name = "btree_bench"
harness = false
